syntax = "proto3";

package remarkgram.files.v1;

service FilesService {
  rpc AttachPostImages(AttachPostImagesRequest) returns (AttachPostImagesResponse);
  rpc CancelPostImageAttachment(CancelPostImageAttachmentRequest) returns (CancelPostImageAttachmentResponse);
  rpc AttachAvatarFile(AttachAvatarFileRequest) returns (AttachAvatarFileResponse);
  rpc ScheduleAttachedFileDeletion(ScheduleAttachedFileDeletionRequest) returns (ScheduleAttachedFileDeletionResponse);
  rpc InitiateAvatarUpload(InitiateAvatarUploadRequest) returns (ImageUploadSession);
  rpc InitiateImageUploads(InitiateImageUploadsRequest) returns (InitiateImageUploadsResponse);
  rpc CompleteImageUploads(CompleteImageUploadsRequest) returns (CompleteImageUploadsResponse);
  rpc GetFileDownloadUrl(GetFileDownloadUrlRequest) returns (GetFileDownloadUrlResponse);
}

message AttachAvatarFileRequest {
  string user_id = 1;
  string file_id = 2;
  string operation_id = 3;
}

message AttachAvatarFileResponse {}

message ScheduleAttachedFileDeletionRequest {
  string user_id = 1;
  string file_id = 2;
}

message ScheduleAttachedFileDeletionResponse {}

service TestingService {
    rpc DeleteAllData(DeleteAllDataRequest) returns (DeleteAllDataResponse);
}

message InitiateImageUploadsRequest {
    string user_id = 1;
    repeated ImageUploadMetadata images = 2;
}

message InitiateAvatarUploadRequest {
    string user_id = 1;
    string client_file_id = 2;
    string original_filename = 3;
    string content_type = 4;
    int32 size = 5;
}

message ImageUploadMetadata {
    string original_filename = 1;
    string content_type = 2;
    int32 size = 3;
    string client_file_id = 4;
}

message InitiateImageUploadsResponse {
    repeated ImageUploadSession sessions = 1;
}

message ImageUploadSession {
    string id = 1;
    string client_file_id = 2;
    string url = 3;
    map<string, string> fields = 4;
}

message CompleteImageUploadsRequest {
    string user_id = 1;
    repeated string upload_ids = 2;
}




message CompleteImageUploadsResponse {}

message DeleteAllDataRequest {}

message DeleteAllDataResponse {}




message GetFileDownloadUrlRequest {
    string file_id = 1;
}

message GetFileDownloadUrlResponse {
    string url = 1;
}

message AttachPostImagesRequest {
  string user_id = 1;
  repeated string file_ids = 2;
  string operation_id = 3;
}
message AttachPostImagesResponse {}

message CancelPostImageAttachmentRequest {
  string user_id = 1;
  repeated string file_ids = 2;
  string operation_id = 3;
}
message CancelPostImageAttachmentResponse {}
