$kind: http-request
name: GET /plans
method: GET
url: '{{base_url}}/plans'
order: 1000
examples: './.resources/get-plans.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns a plan array', () => {
        const body = pm.response.json();
        pm.expect(body).to.be.an('array');
        body.forEach((plan) => {
          pm.expect(plan).to.have.all.keys('id', 'price', 'currency', 'periodCount', 'periodUnit');
        });
      });
