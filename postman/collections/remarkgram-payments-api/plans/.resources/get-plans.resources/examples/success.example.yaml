$kind: http-example
name: Available plans
order: 1000
request:
  method: GET
  url: '{{base_url}}/plans'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": 1,
          "price": 999,
          "currency": "USD",
          "periodCount": 1,
          "periodUnit": "MONTH"
        }
      ]
