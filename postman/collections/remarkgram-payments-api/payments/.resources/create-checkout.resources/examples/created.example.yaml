$kind: http-example
name: Checkout created
order: 1000
request:
  method: POST
  url: '{{base_url}}/payments/checkout'
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "paymentId": "11111111-1111-4111-8111-111111111111",
        "checkoutUrl": "https://checkout.stripe.com/c/pay/cs_test_example",
        "status": "PENDING"
      }
