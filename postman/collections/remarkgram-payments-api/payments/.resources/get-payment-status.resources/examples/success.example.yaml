$kind: http-example
name: Owned payment status
order: 1000
request:
  method: GET
  url: '{{base_url}}/payments/:paymentId/status'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "paymentId": "11111111-1111-4111-8111-111111111111",
        "status": "PENDING",
        "paidAt": null
      }
