$kind: http-example
name: Missing or non-owned payment
order: 2000
request:
  method: GET
  url: '{{base_url}}/payments/:paymentId/status'
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 404,
        "code": "PAYMENT_NOT_FOUND",
        "message": "Payment 11111111-1111-4111-8111-111111111111 was not found"
      }
