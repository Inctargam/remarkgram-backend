  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "paymentId": "11111111-1111-4111-8111-111111111111",
            "planId": 1,
            "amount": 999,
            "currency": "USD",
            "periodCount": 1,
            "periodUnit": "MONTH",
            "provider": "STRIPE",
            "type": "PURCHASE",
            "status": "PENDING",
            "createdAt": "2026-10-19T12:00:00.000Z",
            "paidAt": null
          }
        ],
        "pageNumber": 1,
        "pageSize": 10,
        "totalCount": 1,
        "pagesCount": 1
      }
