$kind: http-request
name: GET /payments
method: GET
url: '{{base_url}}/payments?pageNumber={{page_number}}&pageSize={{page_size}}'
order: 3000
queryParams:
  - key: pageNumber
    value: '{{page_number}}'
    description: One-based page number.
  - key: pageSize
    value: '{{page_size}}'
    description: Page size from 1 through 100.
examples: './.resources/get-payments.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns an ownership-scoped page', () => {
        const body = pm.response.json();
        pm.expect(body.items).to.be.an('array');
        pm.expect(body.pageNumber).to.eql(Number(pm.variables.replaceIn('{{page_number}}')));
        pm.expect(body.pageSize).to.eql(Number(pm.variables.replaceIn('{{page_size}}')));
        pm.expect(body.totalCount).to.be.a('number');
        pm.expect(body.pagesCount).to.be.a('number');
      });
