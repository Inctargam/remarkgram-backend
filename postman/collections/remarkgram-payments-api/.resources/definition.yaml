$kind: collection
name: Remarkgram Payments API
description: Public plans and authenticated payment checkout, status, and history endpoints exposed by the API Gateway.
variables:
  - key: base_url
    value: 'http://localhost:3000/api/v1'
    description: API Gateway base URL including the global API prefix.
  - key: access_token
    value: ''
    description: Bearer access token. Keep the real value outside version control.
  - key: plan_id
    value: '1'
    description: Existing plan ID used to create a checkout.
  - key: payment_id
    value: '11111111-1111-4111-8111-111111111111'
    description: Payment owned by the authenticated user.
  - key: idempotency_key
    value: '7b96a443-8b33-41cf-9bd9-2f57b720d39e'
    description: UUID v4 for one checkout attempt. Change it for a new attempt.
  - key: page_number
    value: '1'
  - key: page_size
    value: '10'
